<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 文献台帳の型紙(run-bunken-daicho)。scripts/daicho.py kaku が、題(title の中)と本文(main の中)の差し込み口に中身を入れる。
     見た目だけを直す時はこのファイルを直す。色と字の大きさは run-html-visualizer の design-system.md の
     「確定済みのユーザー好み」の値の写し(サマリーのラベル・16px/1.8・青は情報・緑と黄の意味色)。
     外のサイトから何も読み込まない(字は端末の字。CSS と JS はこのページの中)。 -->
<title>@@TITLE@@</title>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--surface:#fff;--text:#1f2430;--muted:#667085;--border:#e4e7ec;
--accent:#2563eb;--accent-soft:#eff4ff;--ok:#188038;--ok-soft:#e9f7ef;--warn:#a16207;--warn-soft:#fcf5dc;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.8 "Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
.label{font-size:13px;color:var(--muted);letter-spacing:.06em}
h1{font-size:24px;line-height:1.45;margin:4px 0 6px}
h2{font-size:18px;margin:28px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
h3{font-size:15.5px;margin:14px 0 2px}
.m{color:var(--muted);font-size:13.5px;line-height:1.7}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin:10px 0}
.card ul{margin:4px 0;padding-left:1.2em}
.lab{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:0 6px;margin-bottom:4px}
.sum{border-left:4px solid var(--accent)}.sum .lab{color:var(--accent);border:1px solid var(--accent)}
.lim{border-left:4px solid var(--warn)}.lim .lab{color:var(--warn);border:1px solid var(--warn)}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6;background:var(--surface)}
th,td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.rt{cursor:pointer}tr.rt:hover td{background:var(--accent-soft)}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--border)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:3px 0}
.chips .gl{font-size:12px;color:var(--muted);min-width:4.5em}
.chip{font:inherit;font-size:13px;line-height:1.5;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:1px 10px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=search]{font:inherit;font-size:14px;border:1px solid var(--border);border-radius:8px;padding:3px 8px;width:14em}
.cnt{font-size:13px;color:var(--muted)}
details.it{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin:8px 0}
details.it>summary{list-style:none;cursor:pointer;padding:10px 14px}
details.it>summary::-webkit-details-marker{display:none}
details.it[open]>summary{border-bottom:1px solid var(--border)}
.no{display:inline-block;min-width:2.4em;font-weight:700;color:var(--muted)}
.ti{font-weight:700}
.bib{font-size:14.5px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.b{font-size:12px;line-height:1.6;border-radius:4px;padding:0 6px;white-space:nowrap;border:1px solid var(--border);color:var(--muted)}
.b.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.b.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.b.ac{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.b.rt{border-color:var(--accent);color:var(--accent)}
.body{padding:8px 16px 12px}
.body ul{margin:4px 0;padding-left:1.2em}
.han{font-size:12px;color:var(--muted)}
blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--border);background:var(--bg);font-size:14px}
blockquote .where{display:block;font-size:12px;color:var(--muted)}
dl{display:grid;grid-template-columns:7em 1fr;gap:2px 10px;font-size:13.5px;margin:8px 0 0}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
a{color:var(--accent)}
details.fold{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:8px 14px;margin:8px 0}
details.fold>summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:14.5px}
pre{white-space:pre-wrap;font-size:12.5px;line-height:1.6;background:var(--bg);padding:8px;border-radius:8px}
.draft{background:var(--bg);border-radius:8px;padding:8px 12px;margin:6px 0}
.kak h3{font-size:14.5px;margin:12px 0 2px}.kak ul{margin:2px 0 6px;padding-left:1.2em;font-size:14px;line-height:1.7}
.cite{display:flex;gap:8px;align-items:flex-start;background:var(--accent-soft);border-radius:8px;padding:6px 10px;margin:0 0 8px;font-size:13.5px;line-height:1.6}
.cite-l{flex:none;font-size:12px;color:var(--accent);font-weight:700;padding-top:1px}.cite-t{flex:1;overflow-wrap:anywhere}
.cite .copy{flex:none}
select{font:inherit;font-size:13px;border:1px solid var(--border);border-radius:8px;padding:1px 6px;background:var(--surface)}
.hide{display:none}
@media (max-width:640px){dl{grid-template-columns:1fr}.chips .gl{min-width:auto;width:100%}.bar{position:static}}
@media print{.bar{display:none}details.it{break-inside:avoid}}
</style>
</head>
<body><main>
@@BODY@@
</main>
<script>
(function(){var on={};var q='';
function apply(){var shown=0;document.querySelectorAll('details.it').forEach(function(el){var ok=true;
for(var g in on){if(on[g].size){var v=(el.dataset[g]||'').split(' ');var hit=false;on[g].forEach(function(x){if(v.indexOf(x)>=0)hit=true});if(!hit)ok=false}}
if(ok&&q){ok=el.textContent.toLowerCase().indexOf(q)>=0}
el.classList.toggle('hide',!ok);if(ok)shown++});
var c=document.getElementById('cnt');if(c)c.textContent=shown+'件を表示'}
document.querySelectorAll('.chip[data-g]').forEach(function(b){b.addEventListener('click',function(){var g=b.dataset.g,v=b.dataset.v;on[g]=on[g]||new Set();
var p=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',p?'false':'true');if(p)on[g].delete(v);else on[g].add(v);apply()})});
document.querySelectorAll('tr.rt').forEach(function(tr){tr.addEventListener('click',function(){var b=document.querySelector('.chip[data-g=ronten][data-v="'+tr.dataset.v+'"]');if(b){b.click();b.scrollIntoView({block:'nearest'})}})});
var s=document.getElementById('q');if(s)s.addEventListener('input',function(){q=s.value.trim().toLowerCase();apply()});
var t=document.getElementById('openall');if(t)t.addEventListener('click',function(){var open=t.dataset.open!=='1';
document.querySelectorAll('details.it').forEach(function(d){d.open=open});t.dataset.open=open?'1':'0';t.textContent=open?'すべて閉じる':'すべて開く'});
function kata(){var k=document.getElementById('kata');return k?k.value:'b'}
function citeOf(el){var t=el.querySelector('.cite-t');return t?(t.dataset[kata()]||t.dataset.shoshi):''}
function copyText(s,btn){var done=function(){if(btn){var o=btn.textContent;btn.textContent='コピーした';setTimeout(function(){btn.textContent=o},1200)}};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(done,function(){fb()})}else{fb()}
function fb(){var a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()}}
var ks=document.getElementById('kata');if(ks)ks.addEventListener('change',function(){document.querySelectorAll('.cite-t').forEach(function(t){t.textContent=t.dataset[kata()]||t.dataset.shoshi})});
document.querySelectorAll('.cite .copy').forEach(function(b){b.addEventListener('click',function(e){e.preventDefault();copyText(citeOf(b.closest('details.it')),b)})});
var ca=document.getElementById('copyall');if(ca)ca.addEventListener('click',function(){var L=[];document.querySelectorAll('details.it:not(.hide)').forEach(function(el){L.push(citeOf(el))});copyText(L.join('\n'),ca)});
apply()})();
</script>
</body>
</html>
